:root {
  color-scheme: dark;
  font-family: "Inter Display", Inter, Arial, sans-serif;
  color: #f8f8f8;
  background: #000;
  --muted: #acacac;
  --surface: #0f0f0f;
  --raised: #161616;
  --control-text: #d1d5dc;
}

* { box-sizing: border-box; }
body { margin: 0; min-height: 100dvh; display: grid; grid-template-columns: 240px minmax(0, 1fr); }
body.sidebar-collapsed { grid-template-columns: 68px minmax(0, 1fr); }
button { appearance: none; border: 0; color: inherit; background: transparent; cursor: pointer; font: inherit; }
button:hover { background-color: #202020; }
button:focus-visible { outline: 2px solid #b39af8; outline-offset: 3px; }
p, h1, h2 { margin: 0; }

.sidebar {
  position: relative;
  display: flex;
  flex-direction: column;
  padding: 12.42px 11px 21px 20.5px;
  border-right: 1px solid #161616;
  background: #000;
  font-size: 12px;
}
.sidebar-rule { position: absolute; right: -1px; inset-block: 0; width: 1px; height: auto; overflow: hidden; pointer-events: none; }
.brand { display: flex; align-items: center; gap: 8px; height: 49.72px; margin-bottom: 12.28px; }
.brand strong { font-family: "Courier New", monospace; letter-spacing: -.6px; }
.collapse { margin-left: auto; }
.asset { display: inline-grid; place-items: center; flex: none; width: 16px; height: 16px; }
.asset img { display: block; }
.asset[data-fallback]::before { content: attr(data-fallback); font-size: 10px; }
.asset.loaded::before { content: none; }
.asset.logo { width: 26px; height: 25.72px; }
.asset.panel { width: 20px; height: 20px; }
.asset.panel::before { font-size: 19px; }
nav { display: grid; }
nav button { display: flex; align-items: center; gap: 9px; height: 38.4px; padding: 0 12px; border-radius: 8px; color: var(--muted); text-align: left; }
nav .asset { width: 17px; height: 17px; }
nav button[aria-current] { color: #f8f8f8; font-weight: 600; }
.recents { margin: 10px 0 0 13px; color: var(--muted); line-height: 19.2px; }
.account { display: flex; align-items: center; gap: 9.6px; margin-top: auto; padding: 8px; border-radius: 8px; text-align: left; }
.avatar { width: 26.215px; height: 26.215px; }
.account-text { display: grid; flex: 1; font: 600 12.8px/15.36px Geist, Arial, sans-serif; }
.account small { color: #64748b; font-size: 10.4px; line-height: 12.48px; font-weight: 400; }
.account-icon { width: 14.4px; height: 14px; transform: scaleY(-1); }
.sidebar-collapsed .sidebar { padding-inline: 10px; }
.sidebar-collapsed .sidebar-copy, .sidebar-collapsed .logo { display: none; }
.sidebar-collapsed .collapse { margin: auto; }
.sidebar-collapsed nav button { justify-content: center; }
.sidebar-collapsed nav button:has(.asset:not(.loaded))::after { content: attr(aria-label); font-size: 9px; }
.sidebar-collapsed nav button:has(.asset:not(.loaded)) .asset { display: none; }

main { position: relative; min-height: max(680px, 100dvh); overflow: hidden; display: grid; justify-items: center; grid-template-rows: 1fr auto auto; }
.glow { position: absolute; top: -246px; left: calc(50% - 26px); transform: translateX(-50%); pointer-events: none; width: 1063px; height: 560px; }
.streak { position: absolute; top: 50px; left: calc(50% - 16px); transform: translateX(-50%); display: grid; justify-items: center; gap: 1px; }
.flame { width: 82px; height: 115px; }
.streak strong { color: #ffffff1a; font: 700 40px/48px Geist, Arial, sans-serif; letter-spacing: -2px; }
.practice { align-self: end; width: min(571px, calc(100% - 48px)); }
h1 { font: 700 32px/48px Geist, Arial, sans-serif; letter-spacing: -2px; }
.practice p { margin-top: 8px; color: var(--muted); font-size: 15px; line-height: 21px; letter-spacing: -.15px; }
.options { display: grid; gap: 8px; margin-top: 23.8px; }
.options button {
  display: flex;
  justify-content: space-between;
  align-items: center;
  border: .667px solid var(--raised);
  border-radius: 12px;
  background: var(--surface);
  color: var(--control-text);
  padding: 16px 20px;
  font-size: 14px;
  line-height: 21px;
  letter-spacing: -.15px;
}
.options button:hover { background: #1a1a1a; }
.toolbar {
  margin-top: 45px;
  margin-bottom: 64.33px;
  display: flex;
  align-items: center;
  gap: 8px;
  padding: 6px;
  border: .667px solid var(--raised);
  border-radius: 16px;
  background: var(--surface);
  color: var(--control-text);
  box-shadow: 0 8px 16px #0009;
  font-size: 12px;
}
.toolbar button, #timer { display: flex; align-items: center; justify-content: center; height: 40px; border-radius: 11px; }
#timer, .pill { padding: 0 12px; background: var(--raised); }
#timer { font-family: "Intel One Mono", monospace; letter-spacing: -1px; font-weight: 500; font-variant-numeric: tabular-nums; }
.pill { gap: 4px; letter-spacing: -.15px; }
.icon-button { display: grid; place-items: center; border-radius: 8px; padding: 0; }
.audio { width: 40px; }
.audio[aria-pressed="true"] { background: #323232; }
.divider { height: 32px; width: 1px; background: #444; }
.start { width: 79px; color: #000; background: #f8f8f8; font-size: 14px; }
.start:hover { background: #ddd; }
#status { position: absolute; bottom: 26px; padding-inline: 12px; color: var(--muted); font-size: 12px; text-align: center; }

dialog { width: min(420px, calc(100vw - 32px)); padding: 24px; border: 1px solid #333; border-radius: 16px; background: var(--surface); color: #f8f8f8; }
dialog::backdrop { background: #0009; }
dialog h2 { padding-right: 32px; margin-bottom: 16px; }
dialog p { color: var(--muted); line-height: 1.5; }
.close { position: absolute; top: 12px; right: 12px; width: 32px; height: 32px; border-radius: 8px; font-size: 22px; }
.choices { display: grid; gap: 10px; }
.choice { display: flex; align-items: center; gap: 8px; padding: 10px; border: 1px solid #303030; border-radius: 8px; }
.choice label { flex: 1; cursor: pointer; }
.choice button { padding: 4px 8px; border-radius: 6px; }
.choice button[aria-pressed="true"] { color: #c5adff; }

@media (max-width: 800px) {
  body { grid-template-columns: 174px minmax(0, 1fr); }
  .sidebar { padding-inline: 12px; }
}
@media (max-width: 620px) {
  body, body.sidebar-collapsed { display: block; }
  .sidebar { padding: 4px 12px 8px; border-right: 0; border-bottom: 1px solid #161616; }
  .brand { margin: 0; height: 40px; }
  nav { display: flex; flex-wrap: wrap; }
  nav button { height: 32px; padding-inline: 8px; gap: 4px; }
  nav .asset:not(.loaded) { display: none; }
  .recents, .account, .sidebar-rule, .sidebar-collapsed nav { display: none; }
  .sidebar-collapsed .brand strong { display: inline; }
  .sidebar-collapsed .collapse { margin: 0 0 0 auto; }
  main { min-height: 610px; }
  .streak { top: 22px; left: 50%; }
  .practice { width: calc(100% - 32px); }
  .toolbar { flex-wrap: wrap; justify-content: center; gap: 4px; margin: 32px 8px 44px; }
  .toolbar .pill, #timer { padding-inline: 7px; }
  .toolbar .audio { width: 31px; }
  .start { width: 56px; }
  #status { bottom: 12px; }
}

      <button data-page="Personas" aria-label="Personas"><span class="asset" data-asset="imgIdCard"></span><span class="sidebar-copy">Personas</span></button>

    </div>

      <h1 id="welcome">Welcome back, Ola</h1>
      <p>Ready to speak better? Select an option to get started.</p>
      <div class="options">
        <button data-page="Personas">Available personas <span class="asset" data-asset="imgArrowTurnBackward"></span></button>
        <button data-page="Favorites">Favorites <span class="asset" data-asset="imgArrowTurnBackward"></span></button>

<script>
const find = (selector) => document.querySelector(selector);

const collapse = find('.collapse');
collapse.addEventListener('click', () => {
  const collapsed = document.body.classList.toggle('sidebar-collapsed');
  collapse.setAttribute('aria-expanded', String(!collapsed));
  collapse.setAttribute('aria-label', collapsed ? 'Expand sidebar' : 'Collapse sidebar');
  collapse.firstElementChild.dataset.fallback = collapsed ? '›' : '‹';
});

const dialog = find('#panel-dialog');
const title = find('#panel-title');
const content = find('#panel-content');
const status = find('#status');
const personas = ['Recruiter', 'Hiring manager', 'Peer interviewer'];
const state = { character: personas[0], voice: '', favorites: new Set() };
let elapsed = 0;
let timerId;
let startedAt = 0;
let completed = 0;

function showMessage(message) {
  const paragraph = document.createElement('p');
  paragraph.textContent = message;
  content.append(paragraph);
}

function showChoices(values, key, favoriteButtons) {
  const list = document.createElement('div');
  list.className = 'choices';
  for (const value of values) {
    const row = document.createElement('div');
    row.className = 'choice';
    const input = document.createElement('input');
    const label = document.createElement('label');
    input.type = 'radio';
    input.name = key;
    input.id = `choice-${list.childElementCount}`;
    input.checked = state[key] === value;
    label.htmlFor = input.id;
    label.textContent = value;
    input.addEventListener('change', () => {
      state[key] = value;
      status.textContent = `Selected ${value}.`;
    });
    row.append(input, label);
    if (favoriteButtons) {
      const favorite = document.createElement('button');
      favorite.textContent = 'Favorite';
      favorite.setAttribute('aria-label', `Favorite ${value}`);
      favorite.setAttribute('aria-pressed', String(state.favorites.has(value)));
      favorite.addEventListener('click', () => {
        if (state.favorites.has(value)) state.favorites.delete(value);
        else state.favorites.add(value);
        favorite.setAttribute('aria-pressed', String(state.favorites.has(value)));
      });
      row.append(favorite);
    }
    list.append(row);
  }
  content.append(list);
}

for (const button of document.querySelectorAll('[data-page]')) {
  button.addEventListener('click', () => {
    const page = button.dataset.page;
    if (page === 'Home') {
      find('#welcome').scrollIntoView({ block: 'nearest' });
      return;
    }

    title.textContent = page;
    content.replaceChildren();
    switch (page) {
      case 'Personas':
      case 'Character':
        showChoices(personas, 'character', true);
        break;
      case 'Favorites':
        if (state.favorites.size) showChoices(state.favorites, 'character', false);
        else showMessage('Favorite a persona to see it here.');
        break;
      case 'Voice': {
        const voices = window.speechSynthesis?.getVoices() ?? [];
        if (voices.length) showChoices(voices.map((voice) => voice.name), 'voice', false);
        else showMessage('No voices are available on this device yet.');
        break;
      }
      case 'Account':
        showMessage('Ola Skime · ola@example.com');
        break;
      case 'Settings':
        showMessage('Use the training controls to change your voice, audio, or microphone.');
        break;
      case 'Streaks and rewards':
        showMessage('Current streak: 0 days.');
        break;
      case 'Insights':
        showMessage(`Completed practice sessions: ${completed}.`);
        break;
    }
    dialog.showModal();
  });
}

const start = find('#start');

function renderTimer() {
  const seconds = Math.floor(elapsed / 1000);
  find('#timer').value = [Math.floor(seconds / 60), seconds % 60]
    .map((part) => String(part).padStart(2, '0')).join(':');
}

function beginPractice(resume = false) {
  if (timerId !== undefined) return;
  if (!resume) elapsed = 0;
  startedAt = performance.now() - elapsed;
  renderTimer();
  timerId = window.setInterval(() => {
    elapsed = performance.now() - startedAt;
    renderTimer();
  }, 250);
  start.textContent = 'Stop';
  status.textContent = `Practicing with ${state.character}.`;
  if (sound.getAttribute('aria-pressed') === 'false' && window.speechSynthesis) {
    const prompt = new SpeechSynthesisUtterance('Tell me a little about yourself.');
    prompt.voice = speechSynthesis.getVoices().find((voice) => voice.name === state.voice) ?? null;
    speechSynthesis.speak(prompt);
  }
}

start.addEventListener('click', () => {
  if (timerId === undefined) {
    beginPractice();
    return;
  }
  window.clearInterval(timerId);
  timerId = undefined;
  elapsed = performance.now() - startedAt;
  renderTimer();
  completed += 1;
  window.speechSynthesis?.cancel();
  stopMicrophone();
  start.textContent = 'Start';
  status.textContent = 'Practice stopped.';
});

find('#continue').addEventListener('click', () => beginPractice(true));

const sound = find('#sound');
sound.addEventListener('click', () => {
  const muted = sound.getAttribute('aria-pressed') === 'false';
  sound.setAttribute('aria-pressed', String(muted));
  const action = muted ? 'Unmute audio' : 'Mute audio';
  sound.title = action;
  sound.setAttribute('aria-label', action);
  if (muted) window.speechSynthesis?.cancel();
});

const mic = find('#mic');
let stream;
let micRequest = 0;

function stopMicrophone() {
  micRequest += 1;
  stream?.getTracks().forEach((track) => track.stop());
  stream = undefined;
  mic.setAttribute('aria-pressed', 'false');
  mic.title = 'Enable microphone';
  mic.setAttribute('aria-label', mic.title);
}

mic.addEventListener('click', async () => {
  if (stream) {
    stopMicrophone();
    status.textContent = 'Microphone off.';
    return;
  }
  const request = ++micRequest;
  try {
    const nextStream = await navigator.mediaDevices.getUserMedia({ audio: true });
    if (request !== micRequest) {
      nextStream.getTracks().forEach((track) => track.stop());
      return;
    }
    stream = nextStream;
    mic.setAttribute('aria-pressed', 'true');
    mic.title = 'Disable microphone';
    mic.setAttribute('aria-label', mic.title);
    status.textContent = 'Microphone on.';
  } catch {
    if (request === micRequest) status.textContent = 'Microphone access is unavailable.';
  }
});

window.addEventListener('pagehide', stopMicrophone);
</script>
